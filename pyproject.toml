[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen"
version = "3.0.0"
description = "LUMEN v3: a self-auditing lupus nephritis trial forecaster with a baselines-first module gate. Research and simulation only."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.scripts]
lumen = "lumen.cli:main"

[tool.setuptools]
packages = ["lumen", "lumen.layers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
